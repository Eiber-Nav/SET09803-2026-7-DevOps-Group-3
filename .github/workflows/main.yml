name: Java & Docker CI Pipeline

# Run automatically on pushes and pull requests
on:
  push:
  pull_request:

jobs:

  # Job 1: Run the application unit tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run Unit Tests
        run: mvn -Dtest=com.napier.devops.AppTest test

  # Job 2: Build and test the Docker containers
  docker-build:
    name: Build & Test Docker Compose
    needs: unit-tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # Generate a temporary password for the test database
      - name: Configure Database Password
        run: |
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          echo "DB_PASSWORD=$password" >> "$GITHUB_ENV"

      # Package the application after the unit tests pass
      - name: Package Application
        run: mvn package -DskipTests

      # Build both Docker images
      - name: Build Docker Images
        run: docker compose build

      # Wait until the world database is ready
      - name: Start Database
        run: docker compose up -d --wait --wait-timeout 180 db

      # Run report 1 without waiting for manual input
      - name: Test Population Report
        timeout-minutes: 5
        run: |
          set -o pipefail
          printf '1\n\n0\n' | docker compose run --rm -T --no-deps app | tee report-output.txt

          # Check that the report returned the expected information
          grep -Eq '^CHN[[:space:]]+China[[:space:]]' report-output.txt
          grep -Fq "Query executed successfully against 'world' database." report-output.txt
          grep -Eq '^Total countries found: [1-9][0-9]*$' report-output.txt
          grep -Fq "Application closed." report-output.txt

      # Display the container logs if something goes wrong
      - name: View Container Logs
        if: always()
        run: docker compose logs

      # Remove the test containers when finished
      - name: Clean Up Docker
        if: always()
        run: docker compose down