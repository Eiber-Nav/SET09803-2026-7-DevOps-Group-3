# SET09803 DevOps Environment Setup
# Purpose: Orchestrates the MySQL database and Java application services.
# Testing Commit
services:
  # MySQL Database Service
  db:
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: examplepassword
      MYSQL_DATABASE: world
    ports:
      - "3306:3306"
    volumes:
      # Automatically initializes the database schema and sample data on container startup
      - ./world.sql:/docker-entrypoint-initdb.d/world.sql
  # Java Application Service
  app:
    build: .
    depends_on:
      - db