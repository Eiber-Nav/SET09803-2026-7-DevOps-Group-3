# SET09803 DevOps Environment Setup
# Runs the MySQL database and Java application together.

services:

  # MySQL database service
  db:
    build: db/.
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_DATABASE: world
    ports:
      - "3306:3306"

    # Check that the world database is ready before starting Java
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" -D world -e 'SELECT 1 FROM country LIMIT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Java application service
  app:
    build: .
    environment:
      DB_HOST: db
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}

    # Wait until the database is ready to accept queries
    depends_on:
      db:
        condition: service_healthy

    # Allow users to interact with the report menu
    stdin_open: true
    tty: true